# Two jobs. The brief guard proves no filename or marker from the received
# brief is anywhere in the tree. The Python job runs `make check` under poc/
# (ruff, mypy, pytest against a real Postgres 17, pip-audit, bandit), the same
# command a clone runs locally, so CI and a laptop can't drift.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sh scripts/brief-guard.sh --all
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc
    services:
      db:
        # Postgres 17 to match docs/02 (RDS Postgres 17) and docker-compose.yml.
        image: postgres:17
        env:
          POSTGRES_USER: consult
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: consult
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consult"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONSULT_DB_HOST: 127.0.0.1
      CONSULT_DB_PORT: "5432"
      CONSULT_DB_NAME: consult
      CONSULT_DB_USER: consult
      CONSULT_DB_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poc/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: make check
